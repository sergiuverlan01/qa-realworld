[tool.poetry]
package-mode = false

[project]
name = "qa-realworld"
version = "0.1.0"
description = "QA Automation - API + GUI Testing with pytest and Playwright"
authors = [
    {name = "sergiuverlan01",email = "sergiu_verlan1993@yahoo.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = "^3.12"
dependencies = [
    "pytest (>=9.0.2,<10.0.0)",
    "requests (>=2.32.5,<3.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "faker (>=40.5.1,<41.0.0)",
    "pytest-html (>=4.2.0,<5.0.0)",
    "allure-pytest (>=2.15.3,<3.0.0)",
    "pydantic (>=2.12.5,<3.0.0)",
    "anthropic (>=0.84.0,<0.85.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "black (>=26.1.0,<27.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "isort (>=8.0.1,<9.0.0)"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "smoke: Smoke tests",
    "regression: Regression tests",
]
addopts = "-v"
